name: Feature request / 功能建议
description: Suggest an improvement / 提出改进建议
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case / 使用场景
      description: What are you trying to accomplish? What gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change / 建议的改进
      description: Describe the expected behavior and any alternatives you considered.
    validations:
      required: true
